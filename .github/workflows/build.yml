name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải code và kéo đầy đủ Submodules C++
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. Setup Java (Nâng lên Java 17 để tránh lỗi Gradle)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Thay thế Package Name và Build
      - name: Build Zygisk Module
        run: |
          chmod +x ./gradlew
          sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
          ./gradlew :module:assembleRelease

      # 4. Upload File Zip lên Artifacts (Dùng v4)
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
          path: |
            out/
            out/magisk_module_release/*
            module/build/outputs/apk/*
          if-no-files-found: error
