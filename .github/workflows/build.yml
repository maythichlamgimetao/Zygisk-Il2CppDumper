name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository kèm Submodules
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. Setup Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Cài đặt Android NDK chuẩn
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK Component
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      # 4. Sửa Package Name & Build Gradle
      - name: Build Zygisk Module
        run: |
          chmod +x ./gradlew
          
          # Cấu hình Package Name
          sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle 2>/dev/null || true
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h 2>/dev/null || true
          
          # Đặt biến NDK và chạy Build với log chi tiết
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          ./gradlew :module:assembleRelease --info || ./gradlew assembleRelease --info

      # 5. Kiểm tra và Gom file đầu ra
      - name: Process Output Files
        run: |
          mkdir -p final_output
          
          # Quét tìm tất cả các file zip/apk trong project
          find . -type f \( -name "*.zip" -o -name "*.apk" \) -exec cp {} final_output/ \;
          
          # Kiểm tra thư mục đầu ra
          if [ -z "$(ls -A final_output)" ]; then
            echo "::error::KHÔNG THỂ TẠO FILE! Hãy kiểm tra chi tiết lỗi C++ ở bước Build phía trên."
            exit 1
          else
            echo "Thành công! Danh sách file đã tạo:"
            ls -la final_output/
          fi

      # 6. Upload lên Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
          path: final_output/
          if-no-files-found: error
