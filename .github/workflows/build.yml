name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle

    # BƯỚC QUAN TRỌNG: Cài đặt Android NDK để biên dịch code C++ của Zygisk
    - name: Setup Android NDK
      uses: nwtgck/actions-setup-android-ndk@v1
      with:
        ndk-version: r25c

    - name: Build Zygisk Module
      run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        
        # Truyền biến môi trường NDK vào lệnh build của Gradle
        ./gradlew :module:assembleRelease -Pandroid.ndkPath=$ANDROID_NDK_ROOT

    # Tìm và gom toàn bộ file kết quả bất kể Gradle xuất ra thư mục nào
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-${{ github.run_id }}
        path: |
          out/*.zip
          out/magisk_module_release/*.zip
          **/build/outputs/**/*.zip
        if-no-files-found: error
