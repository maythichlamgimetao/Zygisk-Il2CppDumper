name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    # Cài đặt trình dịch NDK trực tiếp vào hệ thống
    - name: Setup Android NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    # Thực hiện thay đổi tên Package của Game
    - name: Patch Package Name
      run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h

    # Ép biên dịch ra file thư viện gốc .so
    - name: Build Zygisk Module
      run: |
        ./gradlew :module:assembleRelease -Pandroid.ndkPath=$ANDROID_NDK_ROOT

    # TỰ TẠO FILE ZIP: Không phụ thuộc vào thư mục out/ của Gradle
    - name: Create Custom Magisk Zip
      run: |
        mkdir -p my_output/zygisk-il2cppdumper
        # Sao chép các file cấu hình Magisk module vào thư mục tạm
        cp -r template/* my_output/zygisk-il2cppdumper/ || true
        cp module.gradle my_output/zygisk-il2cppdumper/ || true
        
        # Sao chép file .so vừa được compile từ C++ sang thư mục Magisk tương ứng
        mkdir -p my_output/zygisk-il2cppdumper/zygisk
        cp -r module/build/intermediates/merged_native_libs/release/out/lib/* my_output/zygisk-il2cppdumper/zygisk/ || true
        
        # Tiến hành nén thành file zip hoàn chỉnh
        cd my_output/zygisk-il2cppdumper
        zip -r ../../zygisk-module.zip ./*
        cd ../..

    # Đẩy file zip lên hệ thống để tải về
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-${{ github.run_id }}
        path: zygisk-module.zip
        if-no-files-found: error
