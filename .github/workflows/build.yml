name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository kèm Submodules (Dùng v5 / v4 mới nhất)
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # 2. Setup Java 17 với NDK support (Dùng v5)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Thay thế Package Name và chạy Build
      - name: Build Zygisk Module
        run: |
          chmod +x ./gradlew
          
          # Thay thế Package Name vào file config
          sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
          
          # Biên dịch dự án
          ./gradlew :module:assembleRelease --stacktrace

      # 4. Gom tất cả file đầu ra vào một thư mục để đảm bảo không bị sót
      - name: Prepare Artifacts
        run: |
          mkdir -p final_output
          find . -type f \( -name "*.zip" -o -name "*.apk" \) -exec cp {} final_output/ \;
          echo "Danh sach file output:"
          ls -la final_output/

      # 5. Upload Artifact (Dùng v5 - hỗ trợ native Node 24)
      - uses: actions/upload-artifact@v5
        with:
          name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
          path: final_output/
          if-no-files-found: error
